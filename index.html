<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techno product</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-list">
                <span><a href="">Home</a></span>
                <span><a href="">Shop Now</a></span>
                <span><a href="">Contack</a></span>
            </div>

            <div class="logodiv">
                <span class="logo">techno</span>
                <small style="font-size: 10px; margin-left: 1rem;">Lorem ipsum</small>
            </div>
            <div class="icon">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bag-shopping"></i>

            </div>
        </nav>
    </header>


    <div class="hero">
        <div>
            <img src="images/whoalice-moore-headsets-1971383-removebg-preview copy.png" alt="">
        </div>
        
        <div>
            <h1>Earphone Bundle</h1>
            <small>Iphone, Earphone, Macbook, imac & Speaker Available</small>
            <button class="btn">Shop Now</button>
        </div>

        <div>
            <img src="images/alessandra_ceja19-woman-6805178-removebg-preview.png" alt="">
        </div>
    </div>

    <div class="best-seller">
        <h2>Best Seller</h2>
    </div>

    <div class="product-grid">
        <div class="grid-card">
            <img src="images/20twenty-earphones-5598952.jpg" alt="" >
            <button class="sale">Sale</button>
            <p>earphon</p>
            <strike>$299 USD</strike> 
            <span>199.00 USd</span>
        </div>
        <div class="grid-card">
            <img src="images/20twenty-earphones-5598952.jpg" alt="">
            <button class="sale">Sale</button>
            <p>Headphone</p>
            <strike>$299 USD</strike>
            <span>199.00 USd</span>
            
        </div>
        <div class="grid-card">
            <button class="sale">Sale</button>
            <img src="images/20twenty-earphones-5598952.jpg" alt="">
            <p>Iphone</p>
            <strike>$299 USD</strike>
            <span>199.00 USd</span>
            
        </div>
        <div class="grid-card">
            <img src="images/20twenty-earphones-5598952.jpg" alt="">
            <button class="sale">Sale</button>
            <p>Peaker</p>
            <strike>$299 USD</strike>
            <span>199.00 USd</span>
           
        </div>
    </div>

    <div class="shop-by-category">
        <h2 >Shop by category</h2>
    </div>

    

    <div class="category">
        <div class="category-card">
            <img src="images/20twenty-earphones-5598952.jpg" alt="">
        </div>
        <div class="category-card">
            <img src="images/bru-no-multimedia-870744.jpg" alt="">
        </div>
        <div class="category-card">
            <img src="images/bru-no-multimedia-870744.jpg" alt="">
        </div>

    </div>


</body>
</html>
